# Builds the NInfer server image for every commit that reaches `saylek` and for every `saylek-*`
# tag, and publishes it to ghcr.io/saylek-ai/ninfer with a provenance attestation. `saylek` changes
# only through an approved pull request, so every published image comes from an approved commit.
# The build context is the git ref itself, not a checkout: the image sees only committed files.
name: container

on:
  push:
    branches: [saylek]
    tags: ["saylek-*"]

permissions: {}

concurrency:
  group: container-${{ github.ref }}

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      # The CUDA toolkit does not fit in the runner's free space as provisioned.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ github.server_url }}/${{ github.repository }}.git#${{ github.sha }}
          file: packaging/container/Dockerfile
          push: true
          tags: |
            ghcr.io/saylek-ai/ninfer:${{ github.sha }}
            ghcr.io/saylek-ai/ninfer:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.description=NInfer server with the fixes Saylek carries, built from ${{ github.ref_name }}

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/saylek-ai/ninfer
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
